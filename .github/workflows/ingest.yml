name: ingest
# EasyData + SBP ingestion from GitHub's Azure runners (which reach easydata.sbp.org.pk
# and sbp.org.pk, unlike the VPS/WARP). Writes to the VPS Postgres over a restricted
# SSH tunnel. MUFAP + PBS keep running on the VPS.
on:
  schedule:
    - cron: '0 1,13 * * *'   # twice daily (~450 calls/day, well under EasyData 2000/day). Every-3h (8 runs) saturated the rolling 24h quota window -> 429s.
  workflow_dispatch:
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install -q -r requirements.txt
      - name: open DB tunnel to VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_TUNNEL_KEY }}" > ~/.ssh/tunnel_key
          chmod 600 ~/.ssh/tunnel_key
          # Keepalives so the tunnel survives the multi-minute EasyData run —
          # without them the forward was torn down mid-run (Connection refused),
          # leaving syncs unable to write and runs stuck 'running'.
          # Retry: the VPS can briefly be unreachable (a transient SSH timeout),
          # which used to fail the whole run and send a false-alarm alert email.
          # Fail fast per attempt (ConnectTimeout) and retry a few times so only a
          # sustained outage fails the run.
          ok=""
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/tunnel_key -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes \
                 -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
                 -o TCPKeepAlive=yes -f -N -L 5432:127.0.0.1:5432 root@${{ secrets.VPS_HOST }}; then
              ok=1; echo "tunnel up (attempt $i)"; break
            fi
            echo "tunnel attempt $i failed; retrying in 20s"; sleep 20
          done
          [ -n "$ok" ] || { echo "tunnel failed after 5 attempts"; exit 1; }
      - name: run EasyData + SBP jobs
        env:
          DATABASE_URL: postgresql://pakdata:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/pakdata
          # Multi-key rotation (comma-separated) so the ~226 dataset meta-checks
          # don't starve data pulls of the single-key 250/hour budget. Falls back
          # to the single EASYDATA_API_KEY if the list secret is unset.
          EASYDATA_API_KEYS: ${{ secrets.EASYDATA_API_KEYS }}
          EASYDATA_API_KEY: ${{ secrets.EASYDATA_API_KEY }}
          RAW_ARCHIVE_DIR: /tmp/raw
          EASYDATA_QUOTA_PATH: /tmp/raw/quota.json
          # Time-boxed runner: stop cleanly at the hourly cap (mark run 'partial')
          # instead of sleeping ~1h and getting killed by timeout-minutes.
          EASYDATA_QUOTA_NOSLEEP: '1'
          # Fetch this many series in parallel. Each call is ~3s and a run is
          # hour-capped, so serial runs idle ~35 min; parallelism cuts that to a few
          # minutes (quota bookkeeping is lock-serialized, so the per-key rate cap is
          # still honoured). Requires NOSLEEP (above). 1 = serial fallback.
          EASYDATA_CONCURRENCY: '4'
        run: |
          mkdir -p /tmp/raw
          set +e
          for job in easydata_sync sbp_kibor sbp_policy_rate sbp_auctions; do
            echo "::group::$job"
            python -m ingestion.run "$job" --force
            echo "exit=$? for $job"
            echo "::endgroup::"
          done
