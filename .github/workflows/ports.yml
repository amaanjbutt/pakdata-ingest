name: ports
# Karachi Port Trust's daily cargo (tonnage) and container (TEU) reports, and its vessel history (every
# ship call: arrival, departure, purpose), from GitHub's Azure runners. KPT's report host
# antares.kpt.gov.pk:90 answers the runners (6/6 on 2026-10-31) and Cloudflare; kpt.gov.pk answers the
# runners since November 2026 (6/6 on 2026-11-14, reset on 2026-10-31); both time out from the VPS
# (kpt_probe.yml). Each report shows only the latest day — there is no archive — so the jobs run twice a
# day and store what they see; the second run records any figures KPT restated and departures since the
# morning. Port Qasim (pqa_shipping) runs on the VPS scheduler, not here.
# Same restricted SSH tunnel to the VPS Postgres as the other workflows.
on:
  schedule:
    - cron: '30 5 * * *'     # daily 10:30 PKT
    - cron: '30 12 * * *'    # daily 17:30 PKT
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Re-read the whole vessel history, from 1 May 2026 (kpt_vessel_history --backfill)'
        type: boolean
        default: false
concurrency:
  group: ports
  cancel-in-progress: false
jobs:
  gate:
    # The VPS scheduler dispatches this workflow on time (backend/ingestion/gha_dispatch.py, slots in
    # schedule.GHA_DISPATCH). GitHub's cron above runs hours late or not at all, so it is only the
    # backstop: a scheduled run goes ahead only if nothing was dispatched in the last WITHIN_H hours.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WITHIN_H: '15'
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          since=$(date -u -d "-${WITHIN_H} hours" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?event=workflow_dispatch&created=%3E%3D${since}&per_page=1" --jq .total_count 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ] 2>/dev/null; then
            echo "::notice::dispatched by the VPS clock in the last ${WITHIN_H} h — skipping this late cron run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  kpt:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps
        run: pip install -q -r requirements.txt
      - name: open DB tunnel to VPS
        id: tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_TUNNEL_KEY }}" > ~/.ssh/tunnel_key
          chmod 600 ~/.ssh/tunnel_key
          ok=""
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/tunnel_key -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes \
                 -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
                 -o TCPKeepAlive=yes -f -N -L 5432:127.0.0.1:5432 root@${{ secrets.VPS_HOST }}; then
              ok=1; echo "tunnel up (attempt $i)"; break
            fi
            echo "tunnel attempt $i failed; retrying in 20s"; sleep 20
          done
          [ -n "$ok" ] || { echo "tunnel failed after 5 attempts"; exit 1; }
      - name: kpt_shipping
        env:
          DATABASE_URL: postgresql://pakdata:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/pakdata
          RAW_ARCHIVE_DIR: /tmp/raw
        run: |
          mkdir -p /tmp/raw
          python -m ingestion.run kpt_shipping --force
      - name: kpt_vessel_history
        # its own step: a kpt.gov.pk outage must not cost the day's reports, nor the reverse
        if: ${{ !cancelled() && steps.tunnel.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://pakdata:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/pakdata
          RAW_ARCHIVE_DIR: /tmp/raw
        run: |
          mkdir -p /tmp/raw
          backfill=""
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then backfill="--backfill"; fi
          python -m ingestion.run kpt_vessel_history --force $backfill
