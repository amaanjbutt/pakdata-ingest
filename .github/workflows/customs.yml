name: customs
# FBR customs data from GitHub's Azure runners: www.fbr.gov.pk and download1.fbr.gov.pk time out
# from the VPS but answer the runners (4/4 on 2026-10-31, fbr_probe.yml). Same restricted SSH
# tunnel to the VPS Postgres as the other ingestion workflows.
#   fbr_valuation_rulings  every Monday: FBR's valuation-ruling list, then each new ruling's PDF
#                          (its own text layer). Scans with no text, and text layers that yield no
#                          values, are OCR'd here (rapidocr — the api image ships no OCR engine) into
#                          customs_valuation_tokens, at most 120 a run, and parsed by the job's
#                          second pass.
#   fbr_customs_tariff     first Monday of the month: the two newest tariff editions (a new one
#                          each July), then fbr_customs_concessions (the Fifth Schedule),
#                          fbr_regulatory_duty and fbr_additional_customs_duty (the year's RD and
#                          ACD SROs), all checked against the tariff's codes. backfill=true re-reads every edition,
#                          FY2008-09 on, and every ruling.
on:
  schedule:
    - cron: '20 4 * * 1'     # Mondays 09:20 PKT
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Re-read every tariff edition and every valuation ruling (--backfill)'
        type: boolean
        default: false
      clock:
        description: 'Sent by the VPS scheduler at the Monday slot: behave like the cron (tariff only in the first week)'
        type: boolean
        default: false
concurrency:
  group: customs
  cancel-in-progress: false
jobs:
  gate:
    # The VPS scheduler dispatches this workflow on time (backend/ingestion/gha_dispatch.py, slots in
    # schedule.GHA_DISPATCH). GitHub's cron above runs hours late or not at all, so it is only the
    # backstop: a scheduled run goes ahead only if nothing was dispatched in the last WITHIN_H hours.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          WITHIN_H: '144'
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          since=$(date -u -d "-${WITHIN_H} hours" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?event=workflow_dispatch&created=%3E%3D${since}&per_page=1" --jq .total_count 2>/dev/null || echo 0)
          if [ "${n:-0}" -gt 0 ] 2>/dev/null; then
            echo "::notice::dispatched by the VPS clock in the last ${WITHIN_H} h — skipping this late cron run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  customs:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install deps (+ OCR engine)
        run: pip install -q -r requirements.txt rapidocr_onnxruntime==1.4.4 pymupdf==1.28.2
      - name: open DB tunnel to VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_TUNNEL_KEY }}" > ~/.ssh/tunnel_key
          chmod 600 ~/.ssh/tunnel_key
          ok=""
          for i in 1 2 3 4 5; do
            if ssh -i ~/.ssh/tunnel_key -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes \
                 -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
                 -o TCPKeepAlive=yes -f -N -L 5432:127.0.0.1:5432 root@${{ secrets.VPS_HOST }}; then
              ok=1; echo "tunnel up (attempt $i)"; break
            fi
            echo "tunnel attempt $i failed; retrying in 20s"; sleep 20
          done
          [ -n "$ok" ] || { echo "tunnel failed after 5 attempts"; exit 1; }
      - name: run jobs
        env:
          DATABASE_URL: postgresql://pakdata:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/pakdata
          RAW_ARCHIVE_DIR: /tmp/raw
        run: |
          mkdir -p /tmp/raw
          set +e
          fail=0
          backfill=""
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then backfill="--backfill"; fi
          if [ -n "$backfill" ] || [ "$(date -u +%d)" -le 7 ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.clock }}" != "true" ]; }; then
            echo "::group::fbr_customs_tariff $backfill"
            python -m ingestion.run fbr_customs_tariff --force $backfill || fail=1
            echo "::endgroup::"
            echo "::group::fbr_customs_concessions $backfill"
            python -m ingestion.run fbr_customs_concessions --force $backfill || fail=1
            echo "::endgroup::"
            echo "::group::fbr_regulatory_duty + fbr_additional_customs_duty $backfill"
            python -m ingestion.run fbr_regulatory_duty --force $backfill || fail=1
            python -m ingestion.run fbr_additional_customs_duty --force $backfill || fail=1
            echo "::endgroup::"
          fi
          echo "::group::fbr_valuation_rulings $backfill"
          python -m ingestion.run fbr_valuation_rulings --force $backfill || fail=1
          echo "::endgroup::"
          echo "::group::OCR scanned rulings (120 a run)"
          python -m scripts.ocr_valuation_rulings --db --limit 120 || fail=1
          echo "::endgroup::"
          echo "::group::fbr_valuation_rulings (parse what was OCR'd)"
          python -m ingestion.run fbr_valuation_rulings --force || fail=1
          echo "::endgroup::"
          exit $fail
